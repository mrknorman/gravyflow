[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gravyflow"
dynamic = ["version"]
description = "JAX and Keras 3 tools for gravitational-wave data science."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Michael Norman", email = "mrknorman@proton.me" },
]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
]
# The synthetic path: noise, injections, conditioning, datasets and models.
# JAX is held to one release series: a JAX release may change batch bytes (its
# version is part of a dataset's fingerprint) and its API, so moving to the next
# series is a deliberate change, made with its own evidence.
dependencies = [
  "jax>=0.12.0,<0.13",
  "jaxlib>=0.12.0,<0.13",
  "keras>=3.0",
  "ripplegw>=0.4.1,<0.5",
  "numpy",
  "scipy",
  "h5py",
  "astropy",
  "tqdm",
]

[project.optional-dependencies]
# Real detector data, glitches and events from GWOSC, Gravity Spy and GWDataFind.
realdata = [
  "gwpy",
  "gwdatafind",
  "gwosc",
  "requests",
  "pandas",
]
# Plots and the validation dashboard.
viz = [
  "bokeh>=3.3",
  "panel>=1.3",
  "holoviews>=1.18",
  "datashader",
  "pandas",
]
# The test suite, with the references it checks against.
test = [
  "gravyflow[realdata,viz]",
  "pytest",
  "pytest-cov",
  "lalsuite",
  "pycbc",
]
# The example notebooks and tutorials.
notebooks = [
  "gravyflow[realdata,viz]",
  "ipykernel",
  "matplotlib",
]
# NVIDIA CUDA (Linux x86_64 only). These markers prevent macOS/Apple Silicon installs from trying to pull CUDA wheels.
#
# JAX's own cuda12 extra installs its CUDA 12 plugin and PJRT at the same release
# as jaxlib, and NVIDIA's libraries at the versions that plugin declares: for JAX
# 0.12, cuDNN 9.10.2 or later (below 10) and CUDA's compiler (nvcc) 12.6 or later.
# Pinning NVIDIA's libraries here again would only fall behind JAX's own bounds.
cuda = [
  "jax[cuda12]>=0.12.0,<0.13; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Google Cloud TPUs (Linux only): JAX's TPU runtime, libtpu (0.0.50 for JAX 0.12).
tpu = [
  "jax[tpu]>=0.12.0,<0.13; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/mrknorman/gravyflow"
Repository = "https://github.com/mrknorman/gravyflow"
Changelog = "https://github.com/mrknorman/gravyflow/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "gravyflow.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["gravyflow*"]
exclude = ["gravyflow.tests*", "gravyflow.res*"]

# The data files the package reads; the test data in res/tests stays in the
# repository, and the weights in gravyflow.src.resources.MANIFEST are release
# downloads.
[tool.setuptools.package-data]
gravyflow = [
  "res/noise_profiles/*.csv",
  "res/template_banks/*.json",
  "res/standard/*/*.csv",
  "res/standard/*/*.json",
  "res/model/gabbard_2017.keras",
  "res/model/georgehuerta2017shallow_classification.keras",
  "res/model/georgehuerta2017shallow_regression.keras",
]

[tool.pytest.ini_options]
testpaths = ["gravyflow/tests"]
norecursedirs = ["example_notebooks", "scripts", ".git", "__pycache__", "*.egg-info"]
log_cli = true
log_cli_level = "ERROR"
filterwarnings = [
  "default",
  # External deprecation warnings we cannot fix
  "ignore::DeprecationWarning:scitokens.*",
  "ignore::DeprecationWarning:pkg_resources.*",
  "ignore:distutils Version classes are deprecated:DeprecationWarning",
  "ignore:pkg_resources is deprecated:DeprecationWarning",
  "ignore:Deprecated call to `pkg_resources.declare_namespace`:DeprecationWarning",
  "ignore:Support for identity-based X.509 credentials:DeprecationWarning",
  # Expected warnings in tests (intentional behavior)
  "ignore:Whitening requested for WHITE NOISE:UserWarning",
  "ignore:The structure of `inputs` doesn't match:UserWarning",
  # The NonFiniteWarning error filter is added by gravyflow/tests/conftest.py:
  # naming a gravyflow class here would import gravyflow before conftest.py
  # sets XLA's flags.
]

[tool.coverage.run]
# Coverage is measured by the runs that ask for it (--cov=gravyflow), never by
# default, so a plain pytest passes or fails on its tests alone. Everything the
# package ships is measured; only the tests themselves are left out.
omit = ["gravyflow/tests/*"]

[tool.coverage.report]
show_missing = true
precision = 1
# gravyflow/src and most directories under it are namespace packages (no
# __init__.py): without this, a module no test imports is not counted at all.
include_namespace_packages = true
# The whole suite's floor, checked on the combined data of its parts by
# python -m gravyflow.tests.coverage_floor. It is raised whenever the total
# passes it by more than a point, and lowered only by a stated decision.
fail_under = 92.3
